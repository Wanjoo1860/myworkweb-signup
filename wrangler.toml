name = "myworkweb-signup"
main = "src/index.ts"
compatibility_date = "2024-09-04"
workers_dev = true

[build]
command = "npm install && npm run build"
cwd = "."

[env.production]
name = "production"
routes = [
  { pattern = "myworkwebhome.wjlee1860.workers.dev/*", zone_name = "wjlee1860.workers.dev" }
]

[env.production.vars]
SHAREPOINT_SITE_URL = "https://myworkweb.sharepoint.com/sites/myworkhome"
REDIRECT_URL = "https://myworkwebhome.wjlee1860.workers.dev/login"

[[env.production.secrets]]
name = "TENANT_ID"

[[env.production.secrets]]
name = "CLIENT_ID"

[[env.production.secrets]]
name = "CLIENT_SECRET"

[env.development]
name = "development"

[env.development.vars]
SHAREPOINT_SITE_URL = "https://myworkweb.sharepoint.com/sites/myworkhome"
REDIRECT_URL = "http://localhost:5500/login"
